[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexrays_pytools"
version = "2.0.0"
description = "Comprehensive toolkit for Hex-Rays decompiler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "HexRaysPyTools Rewrite Maintainer", email = "you@example.com"}
]
keywords = ["ida", "hex-rays", "decompiler", "ctree", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.0",
    "mypy>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hexrays_pytools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hexrays_pytools --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: pure unit tests, no IDA mock",
    "mock: tests using IDA API mock",
]

[tool.coverage.report]
# ctree walking code (recast.py, rename.py, swap_if.py, negative_offsets.py)
# operates on live Hex-Rays ctree objects that mocks cannot reproduce. It is
# verified by loading the plugin in a real IDA (idat headless + manual
# right-click testing), not by unit tests — so exclude it from the mock-based
# coverage gate.
omit = [
    "*/domain/ctree/recast.py",
    "*/domain/ctree/rename.py",
    "*/domain/ctree/swap_if.py",
    "*/domain/ctree/negative_offsets.py",
    # Action activate() paths operate on live cfunc/UDT/chooser and cannot
    # be exercised with mocks — verified in real IDA via idat headless.
    "*/domain/actions/struct_creation.py",
    "*/domain/actions/struct_xref.py",
    "*/domain/actions/structs_by_size.py",
    "*/domain/actions/scanners.py",
    "*/domain/actions/guess_allocation.py",
    "*/domain/actions/rename_action.py",
    # The object-visitor hierarchy walks the live ctree via IDA's C++
    # ctree_parentee_t dispatch — mock_ida has no dispatch, so visit_expr /
    # leave_expr / _check_call / _recursive_process cannot be reached from
    # unit tests. The Python-level control flow is tested directly; the
    # end-to-end traversal is verified in real IDA via idat headless.
    # (scanner/helpers.py is NOT omitted — its decompile_function guard and
    # FunctionTouchVisitor collector are pure Python and unit-tested.)
    "*/domain/scanner/visitor_base.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
