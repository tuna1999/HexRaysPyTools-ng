[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexrays_pytools_ng"
version = "1.1.0"
description = "Comprehensive toolkit for Hex-Rays decompiler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "HexRaysPyTools Rewrite Maintainer", email = "you@example.com"}
]
keywords = ["ida", "hex-rays", "decompiler", "ctree", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pyside6>=6.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hexrays_pytools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hexrays_pytools --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: pure unit tests, no IDA mock",
    "mock: tests using IDA API mock",
]

[tool.coverage.report]
# ctree walking code (recast.py, rename.py, swap_if.py, negative_offsets.py)
# operates on live Hex-Rays ctree objects that mocks cannot reproduce. It is
# verified by loading the plugin in a real IDA (idat headless + manual
# right-click testing), not by unit tests — so exclude it from the mock-based
# coverage gate.
omit = [
    "*/domain/ctree/recast.py",
    "*/domain/ctree/rename.py",
    "*/domain/ctree/swap_if.py",
    "*/domain/ctree/negative_offsets.py",
    # Action activate() paths operate on live cfunc/UDT/chooser and cannot
    # be exercised with mocks — verified in real IDA via idat headless.
    "*/domain/actions/struct_creation.py",
    "*/domain/actions/struct_xref.py",
    "*/domain/actions/structs_by_size.py",
    "*/domain/actions/scanners.py",
    "*/domain/actions/guess_allocation.py",
    "*/domain/actions/rename_action.py",
    "*/domain/actions/hx_events.py",
    "*/domain/actions/form_requests.py",
    # The object-visitor hierarchy walks the live ctree via IDA's C++
    # ctree_parentee_t dispatch — mock_ida has no dispatch, so visit_expr /
    # leave_expr / _check_call / _recursive_process cannot be reached from
    # unit tests. The Python-level control flow is tested directly; the
    # end-to-end traversal is verified in real IDA via idat headless.
    # (scanner/helpers.py is NOT omitted — its decompile_function guard and
    # FunctionTouchVisitor collector are pure Python and unit-tested.)
    "*/domain/scanner/visitor_base.py",
    # StructureBuilder widget init_ui() builds the full Qt layout, button
    # wiring, and signal connections — all of which need a real PySide6
    # event loop. The widget is verified end-to-end in real IDA via idat
    # headless + manual interaction. The model operations it delegates to
    # (disable_rows, enable_rows, set_origin, make_array, pack_substructure,
    # remove_items, etc.) are unit-tested in test_structure_model.py.
    "*/ui/widgets/structure_builder.py",
    # StructureModel.pack/finalize/set_decl call live IDA UDT / ask_text /
    # create_type APIs that the mock cannot reproduce; verified end-to-end
    # in real IDA. The Python control flow (disable_rows, enable_rows,
    # set_origin, make_array, remove_items, get_name, have_member, collisions,
    # get_recognized_shape) is unit-tested in test_structure_model.py.
    "*/domain/recon/structure_model.py",
    # DiscoveredVTable (the "recon" path for discovered vtables) reads
    # function pointers, builds UDTs, and auto-creates code. These all
    # call live IDA APIs that the mock cannot reproduce. The Python
    # control flow (heuristic flag, member count, tinfo coercion) is
    # unit-tested in test_discovered_vtable.py.
    "*/domain/recon/discovered_vtable.py",
    # ClassViewer widget: 6 context-menu actions + customContextMenu +
    # activated → open_function + refreshed signal + setFilterCaseSensitivity
    # all need a real PySide6 event loop. Verified in real IDA via idat
    # headless + manual right-click testing. The model methods it drives
    # (refresh, rollback, commit, set_first_argument_type) are unit-tested
    # in test_registered_class.py and test_tree_model.py.
    "*/ui/widgets/class_viewer.py",
    # Browser infrastructure (Class/VirtualMethod/RegisteredVTable) uses
    # live IDA APIs (get_numbered_type, get_udt_details, set_name, apply_tinfo,
    # ask_text) for in-place editing. Verified in real IDA via idat
    # headless + manual interaction. Basic dataclass behaviour is unit-tested.
    "*/domain/browser/registered_class.py",
    "*/domain/browser/registered_vtable.py",
    "*/domain/browser/tree_model.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
